
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMS - Database ER Diagrams</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f4f4f4;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h2 {
            text-align: center;
            margin: 25px 0 15px;
            color: #222;
        }

        .diagram {
            background: white;
            padding: 15px;
            margin-bottom: 30px;
            overflow: auto;
            border-radius: 8px;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <h2>Chen Notation ER Diagram</h2>
    <div class="diagram">
        <img src="chen-er-diagram.png" alt="Chen ER Diagram">
    </div>

    <h2>Crow's Foot ER Diagram</h2>
    <div class="diagram">
        <img src="crow-foot-er-diagram.png" alt="Crow's Foot ER Diagram">
    </div>
    <h2>Additional ER Diagram</h2>
<div class="diagram">
    <img src="ER_Diagram_Chen_Large_zoomable.png"
         alt="Additional ER Diagram">
</div>

</body>
</html>
